<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      font-family: monospace;
      background-color: #121212;
      color: #00ff66;
      padding: 15px;
    }
    h4 {
      margin-top: 0;
      color: #ff3333;
      text-transform: uppercase;
    }
    #contenedor-datos {
      background-color: #1e1e1e;
      padding: 10px;
      border-radius: 5px;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-x: auto;
    }
    .footer {
      font-size: 10px;
      color: #888;
      border-top: 1px solid #333;
      padding-top: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h4>Zona de reflexión</h4>
  <p>Esta extensión simula la obtención de datos desde una base de datos.</p>
  <div id="contenedor-datos">Cargando datos...</div>
  <div class="footer">Con imaginación radical las cosas cambian</div>
  <script src="popup.js"></script>
</body>
</html>
